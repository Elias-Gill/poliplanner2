{{ define "fragments/mobile-modal" }}
  <div
    id="mobile-menu-modal"
    class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center">
    <div
      class="bg-white rounded-xl shadow-2xl w-11/12 max-w-sm max-h-[80vh] overflow-y-auto transition-all duration-300">
      <div
        class="flex items-center justify-between p-4 border-b border-gray-300">
        <span class="text-lg font-semibold text-gray-900">Menú</span>
        <button
          id="mobile-menu-close"
          type="button"
          class="text-gray-500 hover:text-gray-900 focus:outline-none">
          <svg
            class="text-3xl"
            width="1em"
            height="1em"
            fill="currentColor"
            viewBox="0 0 16 16">
            <path
              d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708" />
          </svg>
        </button>
      </div>
      <div id="mobile-menu-content" class="p-4 space-y-3">
        <!-- Aquí se inyecta el contenido dinámico -->
      </div>
    </div>
  </div>
{{ end }}
