{{define "fragments/versions"}}
<div 
    x-data="newsApp()" 
    x-show="showNotice && latestNews" 
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0 translate-y-4"
    x-transition:enter-end="opacity-100 translate-y-0"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="opacity-100 translate-y-0"
    x-transition:leave-end="opacity-0 translate-y-4"
    class="fixed bottom-5 right-5 max-w-sm w-full bg-white border border-gray-300 rounded-sm shadow-lg p-4 z-50"
    style="display: none;"
>
    <!-- Encabezado con Ícono e Información de Versión -->
    <div class="flex items-start gap-3">
        <div class="p-2 bg-primary-50 text-primary-600 rounded-sm shrink-0 mt-0.5">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
        </div>

        <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between gap-2">
                <h4 class="text-xs font-bold text-gray-900 truncate" x-text="latestNews?.title"></h4>
                <span class="text-[10px] font-mono px-1.5 py-0.5 bg-primary-50 text-primary-700 font-semibold rounded-sm" x-text="'v' + latestNews?.version"></span>
            </div>
            <p class="text-[11px] text-gray-500 mt-0.5" x-text="latestNews?.date"></p>

            <!-- Lista resumida de cambios -->
            <ul class="mt-2.5 space-y-1.5 text-xs text-gray-600">
                <template x-for="(change, index) in latestNews?.changes" :key="index">
                    <li class="flex items-start gap-1.5">
                        <span class="text-primary-600 font-bold shrink-0">•</span>
                        <span x-text="change" class="leading-tight"></span>
                    </li>
                </template>
            </ul>

            <!-- Botones de Acción -->
            <div class="mt-4 flex items-center justify-between border-t border-gray-200 pt-3">
                <a 
                    href="/guides/news" 
                    class="text-xs font-medium text-primary-600 hover:text-primary-700 transition-colors flex items-center gap-1"
                >
                    Ver todo el historial
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </a>

                <button 
                    @click="dismissNotice()" 
                    class="px-3 py-1.5 bg-primary-600 hover:bg-primary-700 text-white text-xs font-semibold rounded-sm transition-colors focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-1"
                >
                    Entendido
                </button>
            </div>
        </div>
    </div>
</div>
{{end}}
