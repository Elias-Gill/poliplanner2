{{ define "base" }}
  <!doctype html>
  <html lang="es" class="h-full">
    <head>
      <meta charset="UTF-8" />
      <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <meta name="color-scheme" content="dark light" />

      <link
        rel="stylesheet"
        href="/static/bundle/bootstrap-icons/bootstrap-icons-subset.css" />
      <link rel="stylesheet" href="/static/output.css" />

        <!-- alpine js -->
      <script defer src="/static/bundle/alpinejs/collapse/collapse.min.js"></script>
      <script src="/static/bundle/alpinejs/alpine.min.js" defer></script>

      <script src="/static/js/theme_bootstrap.js"></script>
      <script src="/static/js/theme_toggle.js"></script>

      {{ block "custom_head" . }}{{ end }}
    </head>
    <body class="h-full bg-gray-100 text-gray-900 antialiased">
      <div class="flex h-screen overflow-hidden" x-data="{ sidebarOpen: false }">
        
        <!-- Backdrop oscuro para móvil -->
        <div 
          x-show="sidebarOpen" 
          @click="sidebarOpen = false"
          x-transition.opacity
          class="fixed inset-0 z-40 bg-black/50 md:hidden"
          style="display: none;">
        </div>

        <!-- Sidebar Unificado -->
        {{ template "fragments/sidebar" . }}

        <div class="flex flex-col flex-1 overflow-hidden">
          
          <!-- Header Móvil Modular -->
          {{ template "fragments/header_mobile" . }}

          <!-- Contenido Principal -->
          <main class="flex-1 overflow-y-auto p-3 md:p-8 lg:p-20 lg:pt-10">
            {{ block "content" . }}{{ end }}
          </main>
        </div>
      </div>

      {{ template "fragments/mobile-modal" . }}
      <script src="/static/bundle/medium_zoom/medium_zoom.js"></script>
      <script>
        document.querySelectorAll("nav a.nav-link").forEach((link) => {
          const currentPath = window.location.pathname;
          const linkPath = new URL(link.href).pathname;
          if (currentPath === linkPath || (linkPath !== '/' && currentPath.startsWith(linkPath))) {
            link.classList.add("bg-white/10", "text-blue-400", "font-semibold", "shadow-sm");
            link.classList.remove("text-gray-700");
            const icon = link.querySelector("svg");
            if (icon) {
              icon.classList.remove("text-gray-400");
              icon.classList.add("text-blue-400");
            }

            const titleEl = document.getElementById("header-page-title");
            const titleText = link.querySelector("span");
            if (titleEl && titleText) {
              titleEl.textContent = titleText.textContent;
            }
          }
        });
      </script>
    </body>
  </html>
{{ end }}
