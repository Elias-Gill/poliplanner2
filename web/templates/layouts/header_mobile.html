{{ define "fragments/header_mobile" }}
<header class="flex md:hidden items-center justify-between px-4 py-3 bg-sidebar-bg border-b border-gray-500 text-sidebar-text z-30 shadow-xs">
    <!-- Botón hamburguesa para abrir el sidebar -->
    <button 
        @click="sidebarOpen = !sidebarOpen" 
        class="p-1.5 rounded-sm hover:bg-sidebar-hover focus:outline-none transition-colors"
        aria-label="Abrir menú">
        <i class="bi bi-list text-xl"></i>
    </button>

    <!-- Brand / Logo -->
    <a href="/guides/about" class="flex items-center gap-2">
        <img src="/static/favicon.ico" class="w-6 h-6 bg-white rounded-sm" alt="Logo" />
        <span class="font-semibold text-sm">PoliPlanner</span>
    </a>
</header>
{{ end }}
