{{ define "dashboard/schedule_content" }}
  <div class="space-y-6">
    <!-- Horario Semanal -->
    <div id="vista_semana" class="transition-colors">
      {{ template "dashboard/schedule_week" . }}
    </div>

    <!-- Cronograma de Exámenes -->
    <div id="vista_examenes" class="transition-colors">
      {{ template "dashboard/schedule_exams" . }}
    </div>

    <!-- Información de Secciones -->
    <div id="vista_secciones" class="transition-colors">
      {{ template "dashboard/schedule_sections" . }}
    </div>
  </div>
{{ end }}
