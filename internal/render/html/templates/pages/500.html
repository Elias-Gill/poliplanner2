{{ define "custom_tags" }}
  <title>Error del Servidor (500) — PoliPlanner</title>
  <meta
    name="description"
    content="Ocurrió un problema en nuestros servidores. Estamos trabajando para solucionarlo en PoliPlanner." />

  <!-- Bloqueo estricto para buscadores -->
  <meta name="robots" content="noindex, nofollow" />

  <!-- Open Graph -->
  <meta property="og:title" content="Error del Servidor (500) — PoliPlanner" />
  <meta
    property="og:description"
    content="Ocurrió un error interno en el servidor." />
  <meta property="og:type" content="website" />
{{ end }}

{{ define "content" }}
  <div
    class="flex flex-col items-center justify-center min-h-[calc(100vh-4rem)] px-4 text-center bg-gray-50 dark:bg-gray-900 transition-colors">
    <!-- Badge del código de error -->
    <span
      class="inline-block px-3 py-1 mb-4 text-xs font-bold uppercase tracking-widest text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-950/80 rounded-sm border border-red-100 dark:border-red-900/50">
      Error 500
    </span>

    <h1
      class="text-3xl sm:text-4xl font-extrabold text-gray-900 dark:text-white tracking-tight mb-3">
      Algo salió mal en el servidor
    </h1>

    <p
      class="text-base text-gray-600 dark:text-gray-300 mb-2 max-w-md leading-relaxed">
      Ocurrió un inconveniente inesperado al procesar tu solicitud.
    </p>

    <p class="text-sm text-gray-500 dark:text-gray-400 mb-8">
      Podés intentar nuevamente en unos minutos o regresar al inicio.
    </p>

    <div class="flex items-center gap-3">
      <button
        onclick="window.location.reload()"
        class="inline-flex items-center justify-center px-4 py-2 text-sm font-semibold text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 rounded-sm shadow-sm transition-all duration-200 focus:outline-none">
        Reintentar
      </button>

      <a
        href="/dashboard"
        class="inline-flex items-center justify-center px-5 py-2 text-sm font-semibold text-white bg-primary-600 hover:bg-primary-700 dark:bg-primary-600 dark:hover:bg-primary-500 rounded-sm shadow-sm transition-all duration-200 focus:ring-2 focus:ring-primary-500 focus:outline-none">
        Volver al Inicio
      </a>
    </div>
  </div>
{{ end }}
