{{ define "custom_tags" }}
  <!-- Título directo y descripción enfocada en la acción de acceso -->
  <title>Iniciar Sesión — PoliPlanner</title>
  <meta name="description" content="Accede a tu cuenta de PoliPlanner para gestionar tu horario universitario, consultar tus mallas curriculares y personalizar tu semestre." />

  <!-- Directiva para buscadores en páginas de autenticación -->
  <meta name="robots" content="index, follow" />

  <!-- Canonical para evitar parámetros de consulta duplicados (?redirect=...) -->
  <link rel="canonical" href="https://poliplanner.fly.dev/login" />

  <!-- Open Graph básico -->
  <meta property="og:title" content="Iniciar Sesión — PoliPlanner" />
  <meta property="og:description" content="Accede a tu cuenta de PoliPlanner y organiza tu semestre académico." />
  <meta property="og:url" content="https://poliplanner.fly.dev/login" />
  <meta property="og:type" content="website" />
{{ end }}

{{ define "content" }}
  <div class="md:h-full md:justify-center md:items-center flex">
    <div
      class="w-full max-w-md bg-white rounded-sm border border-gray-300 shadow-lg p-6 md:p-10">
      <div class="text-center mb-5 md:mb-6">
        <img
          src="/static/logo.svg"
          alt="Logo PoliPlanner"
          class="mx-auto h-16 w-auto md:h-20" />
        <h2 class="mt-4 text-2xl font-bold text-gray-900">Iniciar Sesión</h2>
      </div>

      <!-- Mensaje de error (se muestra si viene en los datos) -->
      {{ if .Error }}
        <div
          class="mb-6 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-sm text-sm">
          {{ .Error }}
        </div>
      {{ end }}


      <form
        method="POST"
        action="/login?redirect={{ .Redirect }}"
        class="space-y-3 md:space-y-6">
        <div>
          <label
            for="username"
            class="block text-sm font-medium text-gray-700 mb-1">
            Usuario o correo
          </label>
          <div class="relative">
            <div
              class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg
                class="text-gray-500"
                width="1em"
                height="1em"
                fill="currentColor"
                viewBox="0 0 16 16">
                <path
                  d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z" />
              </svg>
            </div>
            <input
              type="text"
              id="username"
              name="username"
              value="{{ .Username }}"
              class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-gray-900 placeholder-gray-400 transition-colors"
              style="text-transform: lowercase"
              required
              placeholder="usuario123" />
          </div>
        </div>

        <div>
          <label
            for="password"
            class="block text-sm font-medium text-gray-700 mb-1">
            Contraseña
          </label>
          <div class="relative">
            <div
              class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg
                class="text-gray-500"
                width="1em"
                height="1em"
                fill="currentColor"
                viewBox="0 0 16 16">
                <path
                  fill-rule="evenodd"
                  d="M8 0a4 4 0 0 1 4 4v2.05a2.5 2.5 0 0 1 2 2.45v5a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 2 13.5v-5a2.5 2.5 0 0 1 2-2.45V4a4 4 0 0 1 4-4M4.5 7A1.5 1.5 0 0 0 3 8.5v5A1.5 1.5 0 0 0 4.5 15h7a1.5 1.5 0 0 0 1.5-1.5v-5A1.5 1.5 0 0 0 11.5 7zM8 1a3 3 0 0 0-3 3v2h6V4a3 3 0 0 0-3-3" />
              </svg>
            </div>
            <input
              type="password"
              id="password"
              name="password"
              class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 rounded-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 text-gray-900 placeholder-gray-400 transition-colors"
              required
              placeholder="Contraseña" />
          </div>
        </div>

        <div class="flex justify-between text-sm pt-1">
          <a
            href="/password-recovery"
            class="font-medium text-primary-600 hover:text-primary-700 transition-colors">
            ¿Olvidaste la contraseña?
          </a>
        </div>

        <button
          type="submit"
          class="w-full bg-primary-600 text-white py-3 rounded-sm font-semibold hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 transition-colors mt-1">
          Iniciar sesión
        </button>
      </form>

      <div class="mt-6 text-center text-sm text-gray-600">
        ¿No tenés cuenta?
        <a
          href="/signup"
          class="font-medium text-primary-600 hover:text-primary-700 transition-colors">
          Registrate acá
        </a>
      </div>

      <div class="mt-4 text-center text-xs text-gray-500">
        <a href="/tools/" class="hover:underline transition-colors"
          >Herramientas</a
        >
        <span class="mx-2">|</span>
        <a href="/guides/" class="hover:underline transition-colors">Guías</a>
      </div>
    </div>
  </div>
{{ end }}
