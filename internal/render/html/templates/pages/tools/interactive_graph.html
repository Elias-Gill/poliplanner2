{{ define "custom_tags" }}
  <title>Malla Curricular Interactiva — PoliPlanner</title>
  <meta name="description" content="Explora el plan de estudios, correlativas y la malla curricular interactiva de tu carrera en PoliPlanner." />
  
  <!-- Indexable para captar tráfico orgánico -->
  <meta name="robots" content="index, follow" />

  <!-- Ruta exacta de la herramienta -->
  <link rel="canonical" href="https://poliplanner.fly.dev/tools/interactive_graph" />

  <!-- Open Graph -->
  <meta property="og:title" content="Malla Curricular Interactiva — PoliPlanner" />
  <meta property="og:description" content="Visualiza de forma interactiva la malla curricular y correlativas de tu carrera." />
  <meta property="og:url" content="https://poliplanner.fly.dev/tools/interactive_graph" />
  <meta property="og:type" content="website" />
{{ end }}

{{ define "custom_head" }}
<link rel="stylesheet" href="/static/css/interactive_graph.css?2" />

<script src="/static/vendor/d3/d3.min.js" defer></script>
<script src="/static/vendor/interactive_graph/interactive_graph.js?v=23" defer></script>
<script src="/static/vendor/interactive_graph/interactive_graph_load.js?v=23" defer></script>
{{ end }}

{{ define "content" }}
  <!-- Contenedor Raíz: Ocupa todo el ancho/alto con el padding deseado sin desbordar -->
  <div class="w-full h-screen py-4 px-1 md:px-8 flex flex-col overflow-hidden">
    <!-- WRAPPER PRINCIPAL -->
    <div
      id="graph-wrapper"
      class="relative w-full h-full flex flex-col flex-1 min-h-0">
      
      <!-- ===== HEADER ===== -->
      <header id="app-header" class="flex-shrink-0 mb-4 rounded-sm bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 p-4 shadow-sm transition-colors">
        <div id="header-left">
          <div id="header-text">
            <h1 id="career-name" class="text-xl md:text-2xl font-bold text-gray-900 dark:text-white tracking-tight">
              Cargando...
            </h1>
            <div id="career-stats" class="flex flex-wrap gap-2 mt-2">
              <span class="stat-pill text-xs font-semibold px-2.5 py-1 rounded-sm bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-600" id="stat-semesters"></span>
              <span class="stat-pill text-xs font-semibold px-2.5 py-1 rounded-sm bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-600" id="stat-credits"></span>
              <span class="stat-pill text-xs font-semibold px-2.5 py-1 rounded-sm bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-600" id="stat-subjects"></span>
            </div>
          </div>
        </div>

        <div id="selector-wrapper" class="flex items-center gap-2">
          <span id="selector-label" class="text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">
            Carrera
          </span>
          <div id="custom-select" class="relative">
            <button id="custom-select-btn" type="button" class="bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 text-gray-900 dark:text-white text-sm rounded-sm px-3 py-1.5 font-medium hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
              IIN
            </button>
            <ul id="custom-select-list" class="hidden absolute right-0 mt-1 z-50 w-64 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-sm shadow-lg max-h-60 overflow-y-auto text-sm text-gray-800 dark:text-gray-200"></ul>
          </div>
          <select
            id="career-selector"
            class="hidden"
            aria-label="Seleccionar carrera">
            <option value="IAE.json">IAE</option>
            <option value="IEL.json">IEL</option>
            <option value="IEN.json">IEN</option>
            <option value="IEK-CI.json">IEK - Control Industrial</option>
            <option value="IEK-EM.json">IEK - Electrónica Médica</option>
            <option value="IEK-ME.json">IEK - Mecatrónica</option>
            <option value="IEK-TI.json">
              IEK - Teleprocesamiento de Información
            </option>
            <option value="IIN.json" selected>IIN</option>
            <option value="IMK.json">IMK</option>
            <option value="LCA.json">LCA</option>
            <option value="LCIK-AS.json">LCIK - Análisis de Sistemas</option>
            <option value="LCIK-PC.json">
              LCIK - Programación de Computadoras
            </option>
          </select>
        </div>
      </header>

      <!-- ===== GRAPH (Ocupa todo el espacio vertical restante) ===== -->
      <div
        id="graph-container"
        class="relative flex-1 w-full h-full min-h-0 overflow-hidden shadow-xl rounded-sm border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 transition-colors">
        <div id="loading-overlay" class="absolute inset-0 bg-white/80 dark:bg-gray-900/80 backdrop-blur-sm z-30 flex flex-col items-center justify-center gap-3">
          <div class="spinner border-4 border-primary-200 border-t-primary-600 dark:border-primary-950 dark:border-t-primary-400 rounded-full w-8 h-8 animate-spin"></div>
          <div id="loading-text" class="text-sm font-medium text-gray-600 dark:text-gray-300">
            Cargando malla...
          </div>
        </div>
      </div>

      <!-- ===== TOOLTIP FLOTANTE ===== -->
      <div id="node-tooltip" role="tooltip" class="bg-white/95 dark:bg-gray-800/95 border border-gray-200 dark:border-gray-700 shadow-xl backdrop-blur-sm rounded-sm p-3 text-gray-900 dark:text-white transition-colors">
        <div id="tooltip-name" class="font-bold text-sm text-gray-900 dark:text-white mb-2"></div>
        <div class="tooltip-meta flex flex-wrap gap-1.5">
          <span class="tooltip-badge text-[11px] font-semibold px-2 py-0.5 rounded-sm bg-primary-50 dark:bg-primary-950/80 text-primary-600 dark:text-primary-300 border border-primary-100 dark:border-primary-800/50" id="tooltip-badge"></span>
          <span class="tooltip-chip text-[11px] px-2 py-0.5 rounded-sm bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300" id="tooltip-credits"></span>
          <span class="tooltip-chip text-[11px] px-2 py-0.5 rounded-sm bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300" id="tooltip-hours"></span>
        </div>
      </div>

      <!-- Error message -->
      <div
        id="error"
        class="fixed bottom-5 left-5 right-5 bg-red-600 dark:bg-red-700 text-white p-4 rounded-sm text-center font-medium shadow-lg z-40 hidden">
        Error al cargar la malla. Intentá de nuevo.
      </div>
    </div>
  </div>
{{ end }}
