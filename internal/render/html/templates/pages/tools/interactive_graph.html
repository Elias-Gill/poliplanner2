{{ define "custom_tags" }}
  <title>Malla Curricular Interactiva — PoliPlanner</title>
  <meta
    name="description"
    content="Explora el plan de estudios, correlativas y la malla curricular interactiva de tu carrera en PoliPlanner." />

  <!-- Indexable para captar tráfico orgánico -->
  <meta name="robots" content="index, follow" />

  <!-- Ruta exacta de la herramienta -->
  <link
    rel="canonical"
    href="https://poliplanner.fly.dev/tools/interactive_graph" />

  <!-- Open Graph -->
  <meta
    property="og:title"
    content="Malla Curricular Interactiva — PoliPlanner" />
  <meta
    property="og:description"
    content="Visualiza de forma interactiva la malla curricular y correlativas de tu carrera." />
  <meta
    property="og:url"
    content="https://poliplanner.fly.dev/tools/interactive_graph" />
  <meta property="og:type" content="website" />
{{ end }}

{{ define "custom_head" }}
  <link rel="stylesheet" href="/static/css/interactive_graph.css?2" />

  <script src="/static/vendor/d3/d3.min.js" defer></script>
  <script
    src="/static/vendor/interactive_graph/interactive_graph.js?v=23"
    defer></script>
  <script
    src="/static/vendor/interactive_graph/interactive_graph_load.js?v=23"
    defer></script>
{{ end }}

{{ define "content" }}
  <!-- Contenedor Raíz: Ajustado con h-[calc(100dvh-4rem)] o flex dinámico para evitar desbordamiento vertical -->
  <div class="w-full h-[calc(100dvh-4rem)] md:h-[calc(100dvh-4.5rem)] py-3 px-2 md:px-6 flex flex-col overflow-hidden">
    <!-- WRAPPER PRINCIPAL -->
    <div
      id="graph-wrapper"
      class="relative w-full h-full flex flex-col flex-1 min-h-0">
      
      <!-- ===== HEADER ===== -->
      <header
        id="app-header"
        class="flex-shrink-0 mb-3 rounded-sm bg-white dark:bg-zinc-900 border border-gray-200 dark:border-zinc-800 p-3.5 md:p-4 shadow-2xs transition-colors flex flex-col md:flex-row md:items-center md:justify-between gap-3">
        
        <div id="header-left" class="min-w-0">
          <div id="header-text" class="min-w-0">
            <h1
              id="career-name"
              class="text-lg md:text-xl font-bold text-gray-900 dark:text-zinc-100 tracking-tight truncate">
              Cargando...
            </h1>
            <div id="career-stats" class="flex flex-wrap gap-2 mt-1.5">
              <span
                class="stat-pill text-xs font-semibold px-2.5 py-0.5 rounded-xs bg-gray-100 dark:bg-zinc-800 text-gray-700 dark:text-zinc-300 border border-gray-200 dark:border-zinc-700"
                id="stat-semesters"></span>
              <span
                class="stat-pill text-xs font-semibold px-2.5 py-0.5 rounded-xs bg-gray-100 dark:bg-zinc-800 text-gray-700 dark:text-zinc-300 border border-gray-200 dark:border-zinc-700"
                id="stat-credits"></span>
              <span
                class="stat-pill text-xs font-semibold px-2.5 py-0.5 rounded-xs bg-gray-100 dark:bg-zinc-800 text-gray-700 dark:text-zinc-300 border border-gray-200 dark:border-zinc-700"
                id="stat-subjects"></span>
            </div>
          </div>
        </div>

        <div id="selector-wrapper" class="flex items-center gap-2 shrink-0">
          <span
            id="selector-label"
            class="text-xs font-bold uppercase tracking-wider text-gray-500 dark:text-zinc-400">
            Carrera
          </span>
          <div id="custom-select" class="relative">
            <button
              id="custom-select-btn"
              type="button"
              class="bg-gray-50 dark:bg-zinc-800/80 border border-gray-200 dark:border-zinc-700 text-gray-900 dark:text-zinc-100 text-sm rounded-xs px-3 py-1.5 font-medium hover:bg-gray-100 dark:hover:bg-zinc-800 transition-colors cursor-pointer">
              IIN
            </button>
            <ul
              id="custom-select-list"
              class="hidden absolute right-0 mt-1 z-50 w-64 bg-white dark:bg-zinc-900 border border-gray-200 dark:border-zinc-800 rounded-xs shadow-lg max-h-60 overflow-y-auto text-sm text-gray-800 dark:text-zinc-200"></ul>
          </div>
          <select
            id="career-selector"
            class="hidden"
            aria-label="Seleccionar carrera">
            <option value="IAE.json">IAE</option>
            <option value="IEL.json">IEL</option>
            <option value="IEN.json">IEN</option>
            <option value="IEK-CI.json">IEK - Control Industrial</option>
            <option value="IEK-EM.json">IEK - Electrónica Médica</option>
            <option value="IEK-ME.json">IEK - Mecatrónica</option>
            <option value="IEK-TI.json">
              IEK - Teleprocesamiento de Información
            </option>
            <option value="IIN.json" selected>IIN</option>
            <option value="IMK.json">IMK</option>
            <option value="LCA.json">LCA</option>
            <option value="LCIK-AS.json">LCIK - Análisis de Sistemas</option>
            <option value="LCIK-PC.json">
              LCIK - Programación de Computadoras
            </option>
          </select>
        </div>
      </header>

      <!-- ===== GRAPH (Ocupa todo el espacio vertical restante de forma estricta) ===== -->
      <div
        id="graph-container"
        class="relative flex-1 w-full min-h-0 overflow-hidden shadow-2xs rounded-xs border border-gray-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 transition-colors">
        <div
          id="loading-overlay"
          class="absolute inset-0 bg-white/80 dark:bg-zinc-900/80 backdrop-blur-xs z-30 flex flex-col items-center justify-center gap-3">
          <div
            class="spinner border-4 border-primary-200 border-t-primary-600 dark:border-primary-950 dark:border-t-primary-400 rounded-full w-8 h-8 animate-spin"></div>
          <div
            id="loading-text"
            class="text-sm font-medium text-gray-600 dark:text-zinc-300">
            Cargando malla...
          </div>
        </div>
      </div>

      <!-- ===== TOOLTIP FLOTANTE ===== -->
      <div
        id="node-tooltip"
        role="tooltip"
        class="bg-white/95 dark:bg-zinc-900/95 border border-gray-200 dark:border-zinc-800 shadow-xl backdrop-blur-xs rounded-xs p-3 text-gray-900 dark:text-zinc-100 transition-colors">
        <div
          id="tooltip-name"
          class="font-bold text-sm text-gray-900 dark:text-zinc-100 mb-2"></div>
        <div class="tooltip-meta flex flex-wrap gap-1.5">
          <span
            class="tooltip-badge text-[11px] font-semibold px-2 py-0.5 rounded-xs bg-primary-50 dark:bg-primary-950/80 text-primary-600 dark:text-primary-300 border border-primary-100 dark:border-primary-800/50"
            id="tooltip-badge"></span>
          <span
            class="tooltip-chip text-[11px] px-2 py-0.5 rounded-xs bg-gray-100 dark:bg-zinc-800 text-gray-600 dark:text-zinc-300"
            id="tooltip-credits"></span>
          <span
            class="tooltip-chip text-[11px] px-2 py-0.5 rounded-xs bg-gray-100 dark:bg-zinc-800 text-gray-600 dark:text-zinc-300"
            id="tooltip-hours"></span>
        </div>
      </div>

      <!-- Error message -->
      <div
        id="error"
        class="fixed bottom-5 left-5 right-5 bg-red-600 dark:bg-red-700 text-white p-4 rounded-sm text-center font-medium shadow-lg z-40 hidden">
        Error al cargar la malla. Intentá de nuevo.
      </div>
    </div>
  </div>
{{ end }}
